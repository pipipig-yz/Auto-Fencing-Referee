<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
  </marker>
</defs>

<!-- ── Title ── -->
<rect x="0" y="0" width="800" height="40" fill="#1a237e"/>
<text x="400" y="26" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Sabre Priority Decision Algorithm</text>

<!-- ── Inputs ── -->
<rect x="130" y="52" width="240" height="42" rx="7" fill="#fff3e0" stroke="#FF9800" stroke-width="1.5"/>
<text x="250" y="69" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">Inputs</text>
<text x="250" y="85" text-anchor="middle" fill="#555" font-size="10">t_arm · t_lunge · t_launch · pause · step_back</text>

<!-- Input → Step1 -->
<line x1="250" y1="94" x2="250" y2="112" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ═══════════════ STEP 1 ═══════════════ -->
<text x="22" y="134" fill="#1565c0" font-size="11" font-weight="bold">STEP 1</text>
<text x="22" y="148" fill="#777" font-size="9">arm onset</text>
<!-- diamond center (250,148), halfW=120, halfH=28 -->
<polygon points="250,120 370,148 250,176 130,148" fill="#e8f4fd" stroke="#1976D2" stroke-width="1.5"/>
<text x="250" y="144" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">arm_gap</text>
<text x="250" y="160" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">&gt; ARM_THR ?</text>

<!-- Step1 YES → right -->
<line x1="370" y1="148" x2="448" y2="148" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
<text x="409" y="141" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="bold">YES</text>

<!-- Step1 NO → down -->
<line x1="250" y1="176" x2="250" y2="198" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="260" y="191" fill="#c62828" font-size="10" font-weight="bold">NO</text>

<!-- ═══════════════ STEP 2 ═══════════════ -->
<text x="22" y="222" fill="#1565c0" font-size="11" font-weight="bold">STEP 2</text>
<text x="22" y="236" fill="#777" font-size="9">lunge onset</text>
<!-- diamond center (250,234), halfW=120, halfH=28 -->
<polygon points="250,206 370,234 250,262 130,234" fill="#e8f4fd" stroke="#1976D2" stroke-width="1.5"/>
<text x="250" y="230" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">lunge_gap</text>
<text x="250" y="246" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">&gt; LUNGE_THR ?</text>

<!-- Step2 YES → right -->
<line x1="370" y1="234" x2="448" y2="234" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
<text x="409" y="227" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="bold">YES</text>

<!-- Step2 NO → down -->
<line x1="250" y1="262" x2="250" y2="284" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="260" y="277" fill="#c62828" font-size="10" font-weight="bold">NO</text>

<!-- ═══════════════ STEP 3 ═══════════════ -->
<text x="22" y="308" fill="#1565c0" font-size="11" font-weight="bold">STEP 3</text>
<text x="22" y="322" fill="#777" font-size="9">launch time</text>
<!-- diamond center (250,320), halfW=120, halfH=28 -->
<polygon points="250,292 370,320 250,348 130,320" fill="#e8f4fd" stroke="#1976D2" stroke-width="1.5"/>
<text x="250" y="316" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">launch first-mover</text>
<text x="250" y="332" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">deterministic ?</text>

<!-- Step3 YES → right -->
<line x1="370" y1="320" x2="448" y2="320" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
<text x="409" y="313" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="bold">YES</text>

<!-- Step3 NO → down -->
<line x1="250" y1="348" x2="250" y2="372" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="260" y="364" fill="#c62828" font-size="10" font-weight="bold">NO</text>
<text x="260" y="376" fill="#c62828" font-size="9">(exact tie)</text>

<!-- Exact tie → SIMULTANEOUS -->
<rect x="128" y="374" width="244" height="40" rx="7" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
<text x="250" y="392" text-anchor="middle" fill="#880e4f" font-size="12" font-weight="bold">SIMULTANEOUS</text>
<text x="250" y="408" text-anchor="middle" fill="#880e4f" font-size="10">Double Hit — both lights on</text>

<!-- ═══════════════ RESOLVE BOX ═══════════════ -->
<!-- Spans y=114 to y=424, x=448 to x=776 -->
<rect x="448" y="114" width="328" height="310" rx="9" fill="#f9fbe7" stroke="#7cb342" stroke-width="2"/>

<!-- Title bar of resolve -->
<rect x="448" y="114" width="328" height="36" rx="9" fill="#558b2f"/>
<rect x="448" y="130" width="328" height="20" fill="#558b2f"/>
<text x="612" y="138" text-anchor="middle" fill="white" font-size="13" font-weight="bold">resolve(first_mover)</text>

<!-- Penalty note -->
<text x="612" y="165" text-anchor="middle" fill="#33691e" font-size="10" font-weight="bold">penalty = paused OR retreated after own launch</text>

<!-- Divider -->
<line x1="460" y1="176" x2="764" y2="176" stroke="#aed581" stroke-width="1"/>

<!-- ─ OUTCOME 1: FIRST SCORES ─ -->
<rect x="460" y="178" width="304" height="72" rx="5" fill="#e8f5e9"/>
<text x="612" y="198" text-anchor="middle" fill="#2e7d32" font-size="11">first_mover NOT penalised</text>
<rect x="504" y="206" width="216" height="32" rx="5" fill="#43a047"/>
<text x="612" y="227" text-anchor="middle" fill="white" font-size="13" font-weight="bold">FIRST SCORES</text>

<!-- Divider -->
<line x1="460" y1="254" x2="764" y2="254" stroke="#aed581" stroke-width="1"/>

<!-- ─ OUTCOME 2: OTHER SCORES ─ -->
<rect x="460" y="256" width="304" height="78" rx="5" fill="#e8f5e9"/>
<text x="612" y="276" text-anchor="middle" fill="#2e7d32" font-size="11">first_mover penalised,</text>
<text x="612" y="292" text-anchor="middle" fill="#2e7d32" font-size="11">other side NOT penalised</text>
<rect x="492" y="300" width="240" height="28" rx="5" fill="#43a047"/>
<text x="612" y="319" text-anchor="middle" fill="white" font-size="13" font-weight="bold">OTHER SIDE SCORES</text>

<!-- Divider -->
<line x1="460" y1="338" x2="764" y2="338" stroke="#aed581" stroke-width="1"/>

<!-- ─ OUTCOME 3: SIMULTANEOUS ─ -->
<rect x="460" y="340" width="304" height="76" rx="5" fill="#fce4ec"/>
<text x="612" y="360" text-anchor="middle" fill="#880e4f" font-size="11">both sides penalised</text>
<rect x="472" y="368" width="280" height="40" rx="5" fill="#e53935"/>
<text x="612" y="385" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SIMULTANEOUS</text>
<text x="612" y="401" text-anchor="middle" fill="white" font-size="11">Double Hit — both lights on</text>

<!-- ═══ Entry arrows for YES (3 horizontal lines → left edge of resolve box) ═══ -->
<!-- Step1 YES enters at y=148: vertical connector inside box from entry to penalty area -->
<!-- Arrows already drawn above (line x1=370 x2=448 at y=148, 234, 320) -->
<!-- Small circles on left edge of resolve box to mark entry points -->
<circle cx="448" cy="148" r="4" fill="#2e7d32"/>
<circle cx="448" cy="234" r="4" fill="#2e7d32"/>
<circle cx="448" cy="320" r="4" fill="#2e7d32"/>
<!-- vertical connector inside box left margin -->
<line x1="455" y1="148" x2="455" y2="320" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="455" y1="234" x2="468" y2="234" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,2"/>
<text x="463" y="244" fill="#2e7d32" font-size="9">any YES</text>
<text x="463" y="254" fill="#2e7d32" font-size="9">→ resolve</text>

<!-- ═══ Bottom note ═══ -->
<rect x="20" y="436" width="760" height="46" rx="7" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
<text x="400" y="455" text-anchor="middle" fill="#283593" font-size="11" font-weight="bold">Key Thresholds  (config.py)</text>
<text x="400" y="473" text-anchor="middle" fill="#555" font-size="10">ARM_THR — arm-onset simultaneity window     LUNGE_THR — lunge-onset simultaneity window     Step 3: no threshold, any gap counts</text>

<!-- ═══ Penalty note bottom ═══ -->
<rect x="20" y="492" width="760" height="34" rx="7" fill="#fff8e1" stroke="#ffd54f" stroke-width="1.5"/>
<text x="400" y="513" text-anchor="middle" fill="#f57f17" font-size="11">Priority forfeiture: fencer paused ( ≥ PAUSE_MIN_FRAMES ) OR retreated after their own launch</text>

</svg>
</body>
</html>
